<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <linearGradient id="boardGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
  </defs>
  <!-- Background Board -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="url(#boardGrad)" />
  
  <!-- 2x2 grid of cards -->
  <rect x="5" y="5" width="10" height="10" rx="2" fill="#ffffff" />
  <rect x="17" y="5" width="10" height="10" rx="2" fill="#ffffff" />
  <rect x="5" y="17" width="10" height="10" rx="2" fill="#ffffff" />
  <rect x="17" y="17" width="10" height="10" rx="2" fill="#ffffff" fill-opacity="0.7" />
</svg>
